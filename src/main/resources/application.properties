server.port=8888

spring.application.name=springboot
#mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/sentiment_analysis?characterEncoding=UTF-8&&serverTimezone=GMT
spring.datasource.username=root
spring.datasource.password=121144

#mybatis-plus
mybatis-plus.mapper-locations= classpath:mapper/*.xml
#??sql配置
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

#satoken配置
# token 名称（同时也是 cookie 名称）
sa-token.token-name=satoken
# token 有效期（单位：秒） 默认30天，-1 代表永久有效
sa-token.timeout=2592000
# token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
sa-token.active-timeout=-1
# 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
sa-token.is-concurrent=true
# 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
sa-token.is-share=false
# token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
sa-token.token-style=uuid
# 是否输出操作日志
sa-token.is-log=true
## Redis数据库索引（默认为0）
#sa-token.alone-redis.database=1
## Redis服务器地址
#sa-token.alone-redis.host=127.0.0.1
## Redis服务器连接端口
#sa-token.alone-redis.port=6379
## Redis服务器连接密码（默认为空）
#sa-token.alone-redis.password=121144
## 连接超时时间
#sa-token.alone-redis.timeout=10s

#redis配置
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
#使用默认的database
spring.data.redis.database=0
#密码
spring.data.redis.password=121144

#分页器配置
